spring:
  application:
    name: ERHMS
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/erhms}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: false
#    baseline-on-migrate: true
#    baseline-version: 1
server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
#        secure: ${COOKIE_SECURE:false}
        secure: false
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
