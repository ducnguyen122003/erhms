services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-kcn_connect}
      POSTGRES_USER: ${DB_USER:-kcn}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env first}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./G5_BE
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-kcn_connect}
      DB_USER: ${DB_USER:-kcn}
      DB_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env first}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  frontend:
    build: ./G5_FE1
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8082}:80"
    depends_on:
      backend:
        condition: service_healthy
  frontend2:
    build: ./G5_FE2
    ports:
      - "127.0.0.1:${PUBLIC_FRONTEND_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
